<main class="battle">
  @let remaining = placement.remaining();
  @if (remaining !== null) {
    <input
      type="text"
      class="remaining"
      readonly
      aria-label="Blocks left to place"
      [value]="'Remaining: ' + remaining"
    />
  }
  <app-game-clock />

  <h1>Battle</h1>
  @if (size(); as size) {
    <div class="boards">
      <section class="side">
        <app-player-board [size]="size" [shipColor]="shipColor()" />
        @if (game.phase() === 'placing') {
          <app-placement-controls [shipColor]="shipColor()" />
        }
      </section>
      <app-computer-board [size]="size" />
    </div>

    <app-battle-status />
    @if (game.phase() === 'over') {
      <button appButton type="button" (click)="playAgain()">Play again</button>
    }
  }
</main>
