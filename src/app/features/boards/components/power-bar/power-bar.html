<ul class="powers" [attr.aria-label]="label()">
  @for (power of powers(); track power.id) {
    <li>
      @let state = states()[power.id];
      @if (state) {
        <button
          type="button"
          class="power"
          [class.active]="state === 'active' || state === 'on'"
          [class.unaffordable]="unaffordable()[power.id] === true"
          [attr.aria-label]="names()[power.id]"
          [disabled]="state === 'unavailable' || state === 'on'"
          [attr.aria-pressed]="state === 'active' || state === 'on'"
          (click)="activate.emit(power.id)"
        >
          <span class="name">{{ power.label }}</span>
          <span class="price">{{ power.price }} pts</span>
        </button>
        @if (state === 'active' && power.action; as action) {
          <button
            type="button"
            class="action"
            [attr.aria-label]="action.name"
            [disabled]="actionDisabled()[power.id] === true"
            (click)="runAction.emit(power.id)"
          >
            {{ action.label }}
          </button>
        }
      } @else {
        <span class="power">
          <span class="name">{{ power.label }}</span>
          <span class="price">{{ power.price }} pts</span>
        </span>
      }
    </li>
  }
</ul>
