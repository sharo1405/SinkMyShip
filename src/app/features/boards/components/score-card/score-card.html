<div class="score" role="group" [attr.aria-label]="label()">
  <span class="label">{{ label() }}</span>
  <span class="points"
    >{{ score().points }} <span class="unit">{{ unit() }}</span></span
  >
  <span class="badge-slot">
    @for (badge of badges(); track badge.id) {
      <span
        class="badge"
        [class.bonus]="badge.bonus"
        [class.penalty]="!badge.bonus"
        [class.after]="!$first"
      >
        {{ badge.text }}
      </span>
    }
  </span>
</div>
